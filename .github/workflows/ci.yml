# WHAT ACTUALLY GUARDS A PULL REQUEST.
#
# Until now: nothing. This repository had no .github directory at all, so the
# only signal on a PR was Vercel's — and Vercel answers one question, "did it
# deploy", which a change can pass while breaking five hundred tests. Five PRs
# merged that way. Each was fine, and none of them was CHECKED.
#
# (The "check pending forever" this was opened to fix does not exist. The
# `Vercel` entry reports through the commit-status API, where `status` and
# `conclusion` are always null because those fields belong to check RUNS — read
# `state` and it is SUCCESS. The alarm was a misreading; the gap underneath it
# was real and larger.)
#
# ---------------------------------------------------------------- no build --
#
# This deliberately does NOT run `next build`, for two reasons.
#
# It cannot: the build prerenders /lakes, which reads the database, so without
# Supabase credentials it fails at export. Verified, not assumed — the run
# ends with "Export encountered an error on /lakes/page". Making it pass would
# mean putting production secrets into GitHub Actions to duplicate a build
# Vercel already runs on every PR with the real ones.
#
# And it should not: Vercel IS the build check. This job exists to cover what
# Vercel does not look at, which is everything below.
#
# ------------------------------------------------------------ lint is soft --
#
# `eslint .` currently reports 11 errors and 32 warnings, nearly all unused
# imports in the simulation suites. Blocking on that would paint this job red
# on its first run, and a check that is always red is one everybody learns to
# scroll past — worse than no check, because it looks like coverage.
#
# So lint reports and does not block. When the backlog reaches zero, delete the
# `continue-on-error` line; that single line is the whole switch.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first. Nothing here touches shared state, so
# cancelling an in-flight run costs nothing and keeps the queue honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed against.
          node-version: '22'
          cache: npm

      # `ci`, not `install`: it installs exactly what package-lock.json says
      # and fails if the lockfile and package.json disagree, so a dependency
      # cannot drift in through a green build.
      - name: Install
        run: npm ci

      # Ordered cheapest-first so an obvious break reports in seconds rather
      # than after the suite.
      - name: Typecheck
        run: npx tsc --noEmit

      # No environment variables on purpose. The suite runs without a database
      # today and that is a property worth keeping: a test that needs
      # production credentials is a test that can fail for reasons that have
      # nothing to do with the change.
      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .
        continue-on-error: true
